          type: string
        description: Header to override the client timezone for this API request.
        examples:
          Timezone:
            value: Europe/Paris
      tags:
      - Deprecated - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeprecatedBookingCreationInput'
            examples:
              BookingCreationRequestExampleForManager:
                value:
                  pass_id: 1
                  session_ids:
                  - 2
                  spot_id: 4
                  auto_assign_spot: false
                  notify_member: true
                  keep_credits: true
                  option_id: 8
