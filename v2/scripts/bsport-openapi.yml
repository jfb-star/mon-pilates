components:
  schemas:
    BookingCancellationInput:
      type: object
      properties:
        should_force_notify:
          type: boolean
          default: false
          description: Override the default behaviour
        should_force_refund:
          type: boolean
          default: false
          description: Override the default behaviour
    BookingCreationInput:
      type: object
      properties:
        client_id:
          type: integer
          description: The id of the client for whom the booking is being created.
        client_pass_id:
          type: integer
          description: The id of the client pass to use for this booking request
        should_auto_assign_spot:
          type: boolean
          default: false
          description: Whether to automatically assign a spot
        should_keep_credits:
          type: boolean
          default: false
          description: Override the default behaviour
        should_notify_client:
          type: boolean
          default: true
          description: Override the default behaviour
        option_id:
          type: integer
          description: The booking Option to use, only allowed when the list of sessions
            contains only one offer
        session_ids:
          type: array
          items:
            type: integer
          description: The id of the sessions (offers) to book
        spot_id:
          type: integer
          description: The spot id for this booking request
      required:
      - client_id
      - client_pass_id
      - session_ids
    BookingOutput:
      type: object
      description: Abstract serializer class to make all fields read-only.
