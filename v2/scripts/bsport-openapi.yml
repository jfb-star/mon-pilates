              examples:
                NotFoundErrorResponse:
                  value:
                    detail: Resource not found.
                    code: XXX-000
                    status: 404
                  summary: Not Found error response
          description: ''
    post:
      operationId: bookings_create
      description: Create a booking for the given member.
      summary: Create a booking
      parameters:
      - in: header
        name: X-Client-ID
        schema:
          type: string
        description: Header to identify the client making this API request.
        required: true
