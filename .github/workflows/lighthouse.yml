name: Lighthouse CI

on:
  push:
    branches:
      - main
      - v2
  workflow_dispatch:

jobs:
  lighthouse:
    name: Audit public pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for Vercel deploy
        run: sleep 60

      - name: Run Lighthouse CI
        # On failure, dump the last 150 lines of lhci output to the job
        # summary so we can read the assertion failures and public report
        # URLs without auth-gated artifacts.
        run: |
          set +e
          npx @lhci/cli@0.13.x autorun 2>&1 | tee lhci.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            {
              echo "## Lighthouse CI failed (exit $code)"
              echo ""
              echo '```'
              tail -n 150 lhci.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code
