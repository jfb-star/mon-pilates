name: Lighthouse CI

on:
  push:
    branches:
      - main
      - v2
  workflow_dispatch:

# Cancel superseded runs on the same branch so we don't audit stale deploys.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Audit public pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for Vercel deploy
        # Poll v2.mon-pilates.bzh until it serves a fresh deploy (or time out).
        # `curl --retry-connrefused` handles DNS/connection flaps; we also match
        # on HTTP 200 to skip the brief 5xx/502 window during deploy swap.
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://v2.mon-pilates.bzh/ || echo "000")
            if [ "$code" = "200" ]; then
              echo "Deploy is live (HTTP $code) after ${i} attempts"
              exit 0
            fi
            echo "Attempt $i — HTTP $code, waiting 10s…"
            sleep 10
          done
          echo "::error::Vercel deploy did not become healthy within 5 min"
          exit 1

      - name: Run Lighthouse CI
        # On failure, dump the last 150 lines of lhci output to the job
        # summary so we can read the assertion failures and public report
        # URLs without auth-gated artifacts.
        env:
          # Belt-and-braces: most CI images ship Chrome, but LHCI occasionally
          # spawns without inheriting the config's chromeFlags when the Chrome
          # binary is resolved via puppeteer. This env var is respected by
          # Lighthouse's launcher as a fallback.
          CHROME_PATH: /usr/bin/google-chrome
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.ref_name }}
        run: |
          set +e
          npx @lhci/cli@0.13.x autorun --config=./lighthouserc.json 2>&1 | tee lhci.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            {
              echo "## Lighthouse CI failed (exit $code)"
              echo ""
              echo '```'
              tail -n 150 lhci.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Upload Lighthouse report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.run_id }}
          path: |
            .lighthouseci/
            lhci.log
          if-no-files-found: ignore
          retention-days: 14
