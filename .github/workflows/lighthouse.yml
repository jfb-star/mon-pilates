name: Lighthouse CI

on:
  push:
    branches:
      - main
      - v2
  workflow_dispatch:

jobs:
  lighthouse:
    name: Audit public pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for Vercel deploy
        run: sleep 60

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.13.x autorun
