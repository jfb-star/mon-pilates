name: Deploy to OVH

on:
  push:
    branches: [main]
    paths:
      - 'app/public/wp-content/themes/**'
      - 'app/public/wp-content/plugins/**'
      - 'app/public/wp-content/languages/**'
      - 'app/public/wp-content/mu-plugins/**'

jobs:
  deploy:
    name: Deploy to OVH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OVH_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.OVH_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          SSH_CMD: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -p 22
          REMOTE: ${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}
        run: |
          # Themes — sync sans --delete pour ne pas casser les fichiers serveur
          rsync -avz \
            -e "$SSH_CMD" \
            app/public/wp-content/themes/ \
            ${REMOTE}:~/www/wp-content/themes/

          # Plugins — sync sans --delete (le serveur peut avoir des plugins hors repo)
          rsync -avz \
            --exclude='google-listings-and-ads/' \
            -e "$SSH_CMD" \
            app/public/wp-content/plugins/ \
            ${REMOTE}:~/www/wp-content/plugins/

          # Langues
          rsync -avz \
            -e "$SSH_CMD" \
            app/public/wp-content/languages/ \
            ${REMOTE}:~/www/wp-content/languages/

          # MU-plugins
          rsync -avz \
            -e "$SSH_CMD" \
            app/public/wp-content/mu-plugins/ \
            ${REMOTE}:~/www/wp-content/mu-plugins/

      - name: Clear cache
        run: |
          ssh -i ~/.ssh/deploy_key -p 22 \
            ${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }} \
            "rm -rf ~/www/wp-content/cache/all/* 2>/dev/null; echo 'Cache cleared'"
