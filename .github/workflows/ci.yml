# CI workflow for Mon Pilates v2
#
# Triggered on push / pull_request to `main` and `v2`.
#
# Required GitHub repository secrets (Settings → Secrets → Actions):
#   - DATABASE_URL            — Postgres connection string used by the optional E2E job
#   - RESEND_API_KEY          — Resend API key (optional at CI time, but the e2e job
#                               will flip to degraded-mode checks when missing)
#   - STRIPE_SECRET_KEY       — Stripe test key (e.g. sk_test_...)
#   - STRIPE_WEBHOOK_SECRET   — Stripe webhook signing secret (whsec_...)
#   - NEXTAUTH_SECRET         — AuthJS session encryption secret
#
# The main `build-and-test` job runs on every push/PR with dummy env vars so it
# stays green without any real secret. The `e2e` job only runs on PRs and uses
# the secrets above.

name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: v2
    env:
      # Dummy env vars sufficient for `prisma generate`, typecheck, lint and tests.
      # They do NOT open any real connection.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-dummy-auth-secret-not-used-at-runtime
      NEXTAUTH_SECRET: ci-dummy-auth-secret-not-used-at-runtime
      NEXTAUTH_URL: http://localhost:3457
      AUTH_TRUST_HOST: "true"
      RESEND_FROM: "CI <ci@example.test>"
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
      NEXT_PUBLIC_SITE_URL: http://localhost:3457
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    needs: build-and-test
    defaults:
      run:
        working-directory: v2
    env:
      # Real-ish secrets injected from the GitHub secret store. The job is
      # skipped on push events; on PRs from forks these will be empty which
      # will cause the job to fail loudly — that is intentional, external PRs
      # should not gain access to secrets.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      AUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: http://localhost:3457
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3457
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Install Playwright (chromium + OS deps)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: v2/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: v2/test-results
          retention-days: 7
          if-no-files-found: ignore
