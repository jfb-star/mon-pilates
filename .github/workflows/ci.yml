name: CI

on:
  push:
    branches: [main, v2]
    paths:
      - "v2/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, v2]
    paths:
      - "v2/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: v2

jobs:
  typecheck-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    env:
      # Prisma schema is postgresql — generate only needs a parseable URL,
      # it does not open a connection.  We skip `prisma db push` entirely
      # by running `prisma generate` + `next build` directly below.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      # next-auth / credentials — required by env.ts at import time.
      AUTH_SECRET: ci-dummy-auth-secret-not-used-at-runtime
      NEXTAUTH_URL: http://localhost:3457
      # resend.ts throws at module-eval if RESEND_FROM is unset.
      RESEND_FROM: "CI <ci@example.test>"
      # Stripe is optional at boot but we set dummies so any eager usage is quiet.
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
      NEXT_PUBLIC_SITE_URL: http://localhost:3457
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Unit tests
        run: npm run test:unit

      - name: Next build
        id: next_build
        # Bypass the npm "build" script so we skip `prisma db push` entirely.
        # Tee to file so we can upload the log as an artifact on failure.
        run: npx next build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-log
          path: v2/build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload .next build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            v2/.next
            !v2/.next/cache
          retention-days: 1
          if-no-files-found: ignore

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: typecheck-build
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-dummy-auth-secret-not-used-at-runtime
      NEXTAUTH_URL: http://localhost:3457
      RESEND_FROM: "CI <ci@example.test>"
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
      NEXT_PUBLIC_SITE_URL: http://localhost:3457
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prisma generate
        run: npx prisma generate

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: v2/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: v2/test-results
          retention-days: 7
          if-no-files-found: ignore
