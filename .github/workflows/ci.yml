name: CI

on:
  push:
    branches: [main, v2]
    paths:
      - "v2/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, v2]
    paths:
      - "v2/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: v2

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma schema is postgresql — generate only needs a parseable URL,
      # it does not open a connection. We skip `prisma db push` entirely
      # by running `prisma generate` + `next build` directly below.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-dummy-auth-secret-not-used-at-runtime
      NEXTAUTH_URL: http://localhost:3457
      RESEND_FROM: "CI <ci@example.test>"
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
      NEXT_PUBLIC_SITE_URL: http://localhost:3457
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Unit tests
        run: npm run test:unit

      - name: Next build
        # Bypass the npm "build" script so we skip `prisma db push` entirely.
        run: npx next build

      - name: Get Playwright version
        id: pw
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw_cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw_cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.pw_cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: v2/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: v2/test-results
          retention-days: 7
          if-no-files-found: ignore
